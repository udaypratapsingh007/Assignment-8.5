<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery Website</title>
    <meta name="description" content="A responsive photo gallery website built with CSS Grid.">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="page">
      <!-- Header -->
      <header class="page-header">
        <h1>My Photo Gallery</h1>
        <p>A collection of my favorite pictures</p>
      </header>

      <!-- Main grid layout -->
      <main class="gallery">
        <figure class="photo photo-featured">
          <img src="images/photo1.jpg" alt="Featured photo in the gallery">
          <figcaption>Featured Photo</figcaption>
        </figure>

        <figure class="photo">
          <img src="images/photo2.jpg" alt="Photo 2 in the gallery">
          <figcaption>Photo 2</figcaption>
        </figure>

        <figure class="photo">
          <img src="images/photo3.jpg" alt="Photo 3 in the gallery">
          <figcaption>Photo 3</figcaption>
        </figure>

        <figure class="photo">
          <img src="images/photo4.jpg" alt="Photo 4 in the gallery">
          <figcaption>Photo 4</figcaption>
        </figure>

        <figure class="photo">
          <img src="images/photo5.jpg" alt="Photo 5 in the gallery">
          <figcaption>Photo 5</figcaption>
        </figure>

        <figure class="photo">
          <img src="images/photo6.jpg" alt="Photo 6 in the gallery">
          <figcaption>Photo 6</figcaption>
        </figure>

        <figure class="photo">
          <img src="images/photo7.jpg" alt="Photo 7 in the gallery">
          <figcaption>Photo 7</figcaption>
        </figure>

        <figure class="photo">
          <img src="images/photo8.jpg" alt="Photo 8 in the gallery">
          <figcaption>Photo 8</figcaption>
        </figure>
      </main>

      <!-- Footer -->
      <footer class="page-footer">
        <p>Copyright 2026 My Photo Gallery</p>
      </footer>
    </div>
  </body>
</html>
